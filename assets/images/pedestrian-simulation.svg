<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Pedestrian evacuation and flow analysis</title>
  <desc id="desc">A professional stylized visualization of pedestrian trajectories, exits, density, and directional flow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101216"/>
      <stop offset="1" stop-color="#1b1f24"/>
    </linearGradient>
    <linearGradient id="density" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4d5056" stop-opacity="0.15"/>
      <stop offset="0.55" stop-color="#b4a06a" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#d2c398" stop-opacity="0.12"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="70" y="95" width="1060" height="470" rx="18" fill="#14171b" stroke="#353a42" stroke-width="3"/>

  <g stroke="#30353c" stroke-width="2" fill="none">
    <path d="M300 95v155H70M530 95v120h180v140h420M70 390h230v175M530 355v210M890 355v210"/>
    <rect x="705" y="215" width="185" height="140" rx="8"/>
  </g>

  <rect x="1070" y="250" width="60" height="150" fill="#d2c398" opacity="0.9"/>
  <text x="1046" y="230" fill="#d2c398" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">EXIT</text>

  <path d="M150 475C280 415 335 320 470 340S650 465 790 390 930 290 1085 325" fill="none" stroke="#b4a06a" stroke-width="7" stroke-dasharray="14 12"/>
  <path d="M140 215C300 250 390 180 545 245S770 315 1085 325" fill="none" stroke="#8d9299" stroke-width="5" stroke-dasharray="10 13"/>
  <path d="M360 520C455 470 535 430 650 440S850 405 1085 325" fill="none" stroke="#d2c398" stroke-width="4" stroke-dasharray="8 12" opacity="0.78"/>

  <ellipse cx="870" cy="330" rx="220" ry="145" fill="url(#density)"/>

  <g fill="#f1f0eb" stroke="#b4a06a" stroke-width="3">
    <circle cx="185" cy="440" r="14"/><circle cx="260" cy="390" r="14"/><circle cx="355" cy="330" r="14"/>
    <circle cx="475" cy="350" r="14"/><circle cx="585" cy="410" r="14"/><circle cx="700" cy="425" r="14"/>
    <circle cx="805" cy="380" r="14"/><circle cx="895" cy="340" r="14"/><circle cx="985" cy="325" r="14"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="70" y="55" fill="#d2c398" font-size="27" font-weight="700" letter-spacing="2">PEDESTRIAN DYNAMICS · FLOW ANALYSIS</text>
    <text x="70" y="620" fill="#f1f0eb" font-size="42" font-weight="800">Evacuation Scenario &amp; Directional Flow</text>
    <text x="870" y="495" fill="#a7abb2" font-size="21">density region</text>
    <text x="635" y="170" fill="#a7abb2" font-size="20">trajectory and exit utilisation</text>
  </g>
</svg>