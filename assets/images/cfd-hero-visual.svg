<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">Engineering workflow dashboard</title>
  <desc id="desc">Professional CFD workflow graphic showing physics setup, solver, validation and engineering decision blocks.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07172f"/>
      <stop offset="1" stop-color="#102b55"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2448"/>
      <stop offset="1" stop-color="#081a36"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6ad8ff"/>
      <stop offset="1" stop-color="#4a8cff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="900" height="560" rx="36" fill="url(#bg)"/>
  <g opacity="0.16" stroke="#b8eaff" stroke-width="1">
    <path d="M80 78h740M80 142h740M80 206h740M80 270h740M80 334h740M80 398h740M80 462h740"/>
    <path d="M102 58v442M180 58v442M258 58v442M336 58v442M414 58v442M492 58v442M570 58v442M648 58v442M726 58v442M804 58v442"/>
  </g>

  <text x="70" y="78" fill="#eaf8ff" font-family="Inter,Segoe UI,Arial" font-size="28" font-weight="800">CFD engineering workflow</text>
  <text x="70" y="110" fill="#a9bfd8" font-family="Inter,Segoe UI,Arial" font-size="16">From physical setup to validated engineering conclusion</text>

  <g filter="url(#shadow)">
    <rect x="68" y="150" width="180" height="122" rx="18" fill="url(#card)" stroke="#6ad8ff" stroke-opacity="0.35"/>
    <rect x="272" y="150" width="180" height="122" rx="18" fill="url(#card)" stroke="#6ad8ff" stroke-opacity="0.35"/>
    <rect x="476" y="150" width="180" height="122" rx="18" fill="url(#card)" stroke="#6ad8ff" stroke-opacity="0.35"/>
    <rect x="680" y="150" width="152" height="122" rx="18" fill="url(#card)" stroke="#6ad8ff" stroke-opacity="0.35"/>
  </g>

  <g font-family="Inter,Segoe UI,Arial">
    <text x="92" y="190" fill="#6ad8ff" font-size="14" font-weight="800">01</text>
    <text x="92" y="218" fill="#ffffff" font-size="19" font-weight="800">Physics</text>
    <text x="92" y="244" fill="#a9bfd8" font-size="13">Assumptions · BCs · setup</text>

    <text x="296" y="190" fill="#6ad8ff" font-size="14" font-weight="800">02</text>
    <text x="296" y="218" fill="#ffffff" font-size="19" font-weight="800">Solver</text>
    <text x="296" y="244" fill="#a9bfd8" font-size="13">Numerics · code · runs</text>

    <text x="500" y="190" fill="#6ad8ff" font-size="14" font-weight="800">03</text>
    <text x="500" y="218" fill="#ffffff" font-size="19" font-weight="800">Validation</text>
    <text x="500" y="244" fill="#a9bfd8" font-size="13">Benchmarks · residuals</text>

    <text x="704" y="190" fill="#6ad8ff" font-size="14" font-weight="800">04</text>
    <text x="704" y="218" fill="#ffffff" font-size="19" font-weight="800">Decision</text>
    <text x="704" y="244" fill="#a9bfd8" font-size="13">Result · limits</text>
  </g>

  <g fill="none" stroke="#6ad8ff" stroke-width="3" stroke-linecap="round" opacity="0.85">
    <path d="M248 211h24"/>
    <path d="M452 211h24"/>
    <path d="M656 211h24"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="70" y="318" width="356" height="150" rx="20" fill="#071a35" stroke="#6ad8ff" stroke-opacity="0.32"/>
    <rect x="464" y="318" width="368" height="150" rx="20" fill="#071a35" stroke="#6ad8ff" stroke-opacity="0.32"/>
  </g>

  <text x="96" y="354" fill="#ffffff" font-family="Inter,Segoe UI,Arial" font-size="18" font-weight="800">Representative outputs</text>
  <g stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M100 426c42-54 106-76 165-42 42 24 80 20 132-24" stroke="#6ad8ff"/>
    <path d="M100 438c54-28 104-34 154-8 60 31 94-7 142-18" stroke="#f0bd5b" stroke-dasharray="9 9"/>
  </g>
  <path d="M100 442h296M100 382v70" stroke="#8ca4be" stroke-opacity="0.45" stroke-width="2"/>
  <text x="100" y="456" fill="#a9bfd8" font-family="Inter,Segoe UI,Arial" font-size="12">validation curve · reference comparison</text>

  <text x="490" y="354" fill="#ffffff" font-family="Inter,Segoe UI,Arial" font-size="18" font-weight="800">Technical stack</text>
  <g font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="700">
    <rect x="490" y="380" width="86" height="34" rx="17" fill="#123a68" stroke="#6ad8ff" stroke-opacity="0.35"/>
    <text x="514" y="402" fill="#eaf8ff">CFD</text>
    <rect x="586" y="380" width="86" height="34" rx="17" fill="#123a68" stroke="#6ad8ff" stroke-opacity="0.35"/>
    <text x="610" y="402" fill="#eaf8ff">C++</text>
    <rect x="682" y="380" width="86" height="34" rx="17" fill="#123a68" stroke="#6ad8ff" stroke-opacity="0.35"/>
    <text x="703" y="402" fill="#eaf8ff">MPI</text>
    <rect x="490" y="424" width="104" height="34" rx="17" fill="#123a68" stroke="#6ad8ff" stroke-opacity="0.35"/>
    <text x="510" y="446" fill="#eaf8ff">OpenMP</text>
    <rect x="606" y="424" width="104" height="34" rx="17" fill="#123a68" stroke="#6ad8ff" stroke-opacity="0.35"/>
    <text x="628" y="446" fill="#eaf8ff">Python</text>
    <rect x="722" y="424" width="86" height="34" rx="17" fill="#123a68" stroke="#6ad8ff" stroke-opacity="0.35"/>
    <text x="743" y="446" fill="#eaf8ff">HPC</text>
  </g>

  <rect x="70" y="500" width="762" height="1" fill="#6ad8ff" opacity="0.35"/>
  <text x="70" y="528" fill="#eaf8ff" font-family="Inter,Segoe UI,Arial" font-size="16" font-weight="800">Physics setup · numerical method · reproducible runs · validation · reporting</text>
</svg>
