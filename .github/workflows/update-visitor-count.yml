name: Update visitor count

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-count:
    runs-on: ubuntu-latest

    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Fetch latest GoatCounter total
        env:
          GOATCOUNTER_API_KEY: ${{ secrets.GOATCOUNTER_API_KEY }}
        run: |
          python - <<'PY'
          import datetime
          import json
          import os
          import urllib.request

          token = os.environ.get("GOATCOUNTER_API_KEY")
          if not token:
              raise SystemExit("Missing GOATCOUNTER_API_KEY repository secret")

          url = (
              "https://kandil2001.goatcounter.com/api/v0/stats/total"
              "?start=2020-01-01T00%3A00%3A00Z"
          )
          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
              },
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              data = json.load(response)

          output = {
              "count": int(data["total"]),
              "updated_at": datetime.datetime.now(datetime.timezone.utc).isoformat(),
          }

          with open("visitor-count.json", "w", encoding="utf-8") as file:
              json.dump(output, file, indent=2)
              file.write("\n")
          PY

      - name: Commit updated count
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add visitor-count.json
          if git diff --cached --quiet; then
            echo "Visitor count is already current."
            exit 0
          fi
          git commit -m "Update visitor count"
          git push
