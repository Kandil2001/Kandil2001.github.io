name: Clean temporary portfolio branches

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove temporary agent branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for branch in \
            agent/complete-portfolio-update \
            agent/trigger-pages-rebuild \
            agent/deploy-bilingual-portfolio \
            agent/final-pages-deployment \
            agent/confirm-pages-deployment \
            agent/pages-diagnostic-run \
            agent/read-pages-runs
          do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}" || true
          done
