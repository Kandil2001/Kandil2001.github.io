name: Configure Pages source

on:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write

jobs:
  configure:
    if: github.event.head_commit.message == 'Configure Pages Actions source'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set Pages source to GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PUT \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -f build_type=workflow \
            "repos/${GITHUB_REPOSITORY}/pages"

          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/pages" > pages-source-verification.json

      - name: Record verified source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages-source-verification.json
          git commit -m "Record Pages Actions source"
          git push
