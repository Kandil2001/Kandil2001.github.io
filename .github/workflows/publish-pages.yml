name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Build and validate static site
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import re
          import shutil

          required = [
              Path('index.html'),
              Path('cv.html'),
              Path('assets/language.js'),
              Path('assets/language.css'),
              Path('assets/cv-download.js'),
          ]
          missing = [str(path) for path in required if not path.is_file()]
          if missing:
              raise SystemExit(f'Missing required site files: {missing}')

          index = Path('index.html').read_text(encoding='utf-8')
          cv_page = Path('cv.html').read_text(encoding='utf-8')
          language = Path('assets/language.js').read_text(encoding='utf-8')
          if 'data-language-toggle' not in index or 'data-language-toggle' not in cv_page:
              raise SystemExit('Language toggle is missing.')
          if 'de:' not in language or 'Lebenslauf herunterladen' not in language:
              raise SystemExit('German translations are missing.')

          parts = []
          for path in sorted(Path('assets').glob('cv-data-*.js')):
              match = re.search(r'=\s*"([A-Za-z0-9+/=]+)";\s*$', path.read_text(encoding='utf-8'))
              if not match:
                  raise SystemExit(f'Could not read CV data from {path}')
              parts.append(match.group(1))
          pdf = base64.b64decode(''.join(parts), validate=True)
          expected = '7a76b72d61e1872cce05ea292c6a7f6744435634955a5db865d75ca9b76e108c'
          actual = hashlib.sha256(pdf).hexdigest()
          if len(parts) != 5 or not pdf.startswith(b'%PDF-') or actual != expected:
              raise SystemExit(f'CV verification failed: chunks={len(parts)}, sha256={actual}')

          site = Path('_site')
          if site.exists():
              shutil.rmtree(site)
          site.mkdir()
          excluded = {'.git', '.github', '_site'}
          for source in Path('.').iterdir():
              if source.name in excluded:
                  continue
              destination = site / source.name
              if source.is_dir():
                  shutil.copytree(source, destination)
              else:
                  shutil.copy2(source, destination)
          (site / 'Ahmed_Kandil_CV.pdf').write_bytes(pdf)
          (site / '.nojekyll').write_text('', encoding='utf-8')
          print(f'Built bilingual site with verified CV: {len(pdf)} bytes, SHA-256 {actual}')
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
