name: Force Pages Rebuild

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show deployed files
        run: |
          echo "Repository files used for GitHub Pages:"
          ls -la
          echo "Index marker:"
          grep -n "Engineering focus\|Project Case Studies\|Proof of work" index.html || true
