name: Force current GitHub Pages build

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write

jobs:
  request-pages-build:
    if: github.event.head_commit.message == 'Force current Pages build'
    runs-on: ubuntu-latest
    steps:
      - name: Request Pages build from the default branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/pages/builds"
