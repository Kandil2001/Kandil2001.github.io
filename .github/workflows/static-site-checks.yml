name: Static site checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-site:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate internal links and sitemap
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlparse, unquote
          import xml.etree.ElementTree as ET

          root = Path.cwd()
          errors = []

          required_pages = [
              Path("index.html"),
              Path("cv.html"),
              Path("projects/lid-cavity-comparison.html"),
              Path("projects/lid-cavity-cpp.html"),
              Path("projects/lid-cavity.html"),
              Path("projects/lbm-poiseuille.html"),
              Path("projects/distributed-tsp.html"),
              Path("projects/pedestrian-simulation.html"),
              Path("projects/rust-fvm-heat-conduction.html"),
          ]

          for page in required_pages:
              if not (root / page).is_file():
                  errors.append(f"Missing required page: {page}")

          class LinkParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = []

              def handle_starttag(self, tag, attrs):
                  values = dict(attrs)
                  for attr in ("href", "src"):
                      value = values.get(attr)
                      if value:
                          self.links.append(value)

          def local_target(source: Path, value: str):
              value = value.strip()
              parsed = urlparse(value)
              if parsed.scheme in {"http", "https", "mailto", "tel", "data", "javascript"}:
                  return None
              if value.startswith("//") or value.startswith("#"):
                  return None

              path_text = unquote(parsed.path)
              if not path_text:
                  return None

              if path_text.startswith("/"):
                  target = root / path_text.lstrip("/")
              else:
                  target = source.parent / path_text

              if path_text.endswith("/"):
                  target = target / "index.html"

              return target.resolve()

          for html_file in root.rglob("*.html"):
              parser = LinkParser()
              parser.feed(html_file.read_text(encoding="utf-8"))
              for value in parser.links:
                  target = local_target(html_file, value)
                  if target is None:
                      continue
                  try:
                      target.relative_to(root.resolve())
                  except ValueError:
                      errors.append(f"{html_file}: local link escapes repository: {value}")
                      continue
                  if not target.exists():
                      errors.append(f"{html_file}: broken local link: {value}")

          sitemap = root / "sitemap.xml"
          if not sitemap.is_file():
              errors.append("Missing sitemap.xml")
          else:
              namespace = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
              tree = ET.parse(sitemap)
              for loc in tree.findall("sm:url/sm:loc", namespace):
                  url = (loc.text or "").strip()
                  parsed = urlparse(url)
                  path_text = parsed.path.lstrip("/")
                  target = root / (path_text or "index.html")
                  if parsed.path.endswith("/"):
                      target = root / path_text / "index.html"
                  if not target.is_file():
                      errors.append(f"Sitemap target does not exist: {url}")

          stale_markers = {
              "Lid-Cavity-Evolution": "old comparison repository name",
              "What to add": "unfinished placeholder content",
          }
          for html_file in root.rglob("*.html"):
              text = html_file.read_text(encoding="utf-8")
              for marker, meaning in stale_markers.items():
                  if marker in text:
                      errors.append(f"{html_file}: contains {meaning}: {marker}")

          if errors:
              print("Static site validation failed:")
              for error in errors:
                  print(f"- {error}")
              raise SystemExit(1)

          print(f"Validated {len(list(root.rglob('*.html')))} HTML files successfully.")
          PY
