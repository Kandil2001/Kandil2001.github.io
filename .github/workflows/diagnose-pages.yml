name: Diagnose and configure GitHub Pages

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  actions: read
  pull-requests: write

jobs:
  configure-pages-source:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read Pages configuration and deployment runs
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set +e
          pages=$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/pages" \
            --jq '{status,build_type,source,html_url}' 2>&1)
          pages_code=$?

          update=$(gh api --method PUT \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -f build_type=workflow \
            "repos/${GITHUB_REPOSITORY}/pages" 2>&1)
          update_code=$?

          runs=$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/publish-pages.yml/runs?branch=main&per_page=10" \
            --jq '.workflow_runs | map({id,status,conclusion,event,head_sha,created_at,updated_at,html_url})' 2>&1)
          runs_code=$?

          {
            echo '## GitHub Pages diagnostic'
            echo
            echo "- Read Pages exit code: \`${pages_code}\`"
            echo "- Select Actions source exit code: \`${update_code}\`"
            echo "- List deployment runs exit code: \`${runs_code}\`"
            echo
            echo '### Pages configuration'
            echo '```json'
            printf '%s\n' "$pages"
            echo '```'
            echo
            echo '### Source update response'
            echo '```text'
            printf '%s\n' "${update:-No response body; GitHub accepted the update.}"
            echo '```'
            echo
            echo '### Recent deployment runs'
            echo '```json'
            printf '%s\n' "$runs"
            echo '```'
          } > /tmp/pages-diagnostic.md

          gh pr comment "$PR_NUMBER" --body-file /tmp/pages-diagnostic.md

          test "$pages_code" -eq 0
          test "$update_code" -eq 0
          test "$runs_code" -eq 0
