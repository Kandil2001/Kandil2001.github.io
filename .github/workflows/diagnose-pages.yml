name: Diagnose GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write
  pages: read

jobs:
  diagnose:
    if: github.event.head_commit.message == 'Diagnose Pages publishing'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read Pages configuration and latest build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/pages" > pages-status.json
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/pages/builds/latest" > pages-build-latest.json || true

      - name: Save diagnostic result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages-status.json pages-build-latest.json
          git commit -m "Record Pages publishing status" || exit 0
          git push
