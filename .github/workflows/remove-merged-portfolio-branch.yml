name: Remove merged portfolio branch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  remove-merged-branch:
    if: github.event.head_commit.message == 'Remove merged portfolio branch'
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged agent branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method DELETE \
            "repos/${GITHUB_REPOSITORY}/git/refs/heads/agent%2Fcomplete-portfolio-update" \
            || true
