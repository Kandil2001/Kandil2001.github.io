name: Deploy portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Validate and build static site
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import shutil

          required = [
              Path("index.html"),
              Path("cv.html"),
              Path("Ahmed_Kandil_CV.pdf"),
              Path("assets/language.js"),
              Path("assets/language.css"),
          ]
          missing = [str(path) for path in required if not path.is_file()]
          if missing:
              raise SystemExit(f"Missing required site files: {missing}")

          index = Path("index.html").read_text(encoding="utf-8")
          cv_page = Path("cv.html").read_text(encoding="utf-8")
          language = Path("assets/language.js").read_text(encoding="utf-8")

          if "data-language-toggle" not in index or "data-language-toggle" not in cv_page:
              raise SystemExit("Language toggle is missing.")
          if "de:" not in language or "Lebenslauf herunterladen" not in language:
              raise SystemExit("German translations are missing.")

          pdf = Path("Ahmed_Kandil_CV.pdf").read_bytes()
          expected_sha256 = "7a76b72d61e1872cce05ea292c6a7f6744435634955a5db865d75ca9b76e108c"
          actual_sha256 = hashlib.sha256(pdf).hexdigest()

          if not pdf.startswith(b"%PDF-"):
              raise SystemExit("Ahmed_Kandil_CV.pdf has no valid PDF header.")
          if b"%%EOF" not in pdf[-1024:]:
              raise SystemExit("Ahmed_Kandil_CV.pdf is truncated.")
          if actual_sha256 != expected_sha256:
              raise SystemExit(
                  f"CV checksum mismatch: expected {expected_sha256}, received {actual_sha256}"
              )

          site = Path("_site")
          if site.exists():
              shutil.rmtree(site)
          site.mkdir()

          excluded = {".git", ".github", "_site"}
          for source in Path(".").iterdir():
              if source.name in excluded:
                  continue
              destination = site / source.name
              if source.is_dir():
                  shutil.copytree(source, destination)
              else:
                  shutil.copy2(source, destination)

          (site / ".nojekyll").write_text("", encoding="utf-8")
          print(
              f"Built portfolio with verified static CV: {len(pdf)} bytes, "
              f"SHA-256 {actual_sha256}"
          )
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4