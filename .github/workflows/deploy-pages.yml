name: Deploy portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build static site and verified CV
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import binascii
          import hashlib
          import re
          import shutil

          required = [
              Path("index.html"),
              Path("cv.html"),
              Path("assets/language.js"),
              Path("assets/language.css"),
              Path("assets/cv-download.js"),
          ]
          missing = [str(path) for path in required if not path.is_file()]
          if missing:
              raise SystemExit(f"Missing required site files: {missing}")

          index = Path("index.html").read_text(encoding="utf-8")
          cv_page = Path("cv.html").read_text(encoding="utf-8")
          language = Path("assets/language.js").read_text(encoding="utf-8")
          if "data-language-toggle" not in index or "data-language-toggle" not in cv_page:
              raise SystemExit("Language toggle is missing.")
          if "de:" not in language or "Lebenslauf herunterladen" not in language:
              raise SystemExit("German translations are missing.")

          encoded_parts = []
          for path in sorted(Path("assets").glob("cv-data-*.js")):
              match = re.search(
                  r'=\s*"([A-Za-z0-9+/=]+)";\s*$',
                  path.read_text(encoding="utf-8"),
              )
              if not match:
                  raise SystemExit(f"Could not read CV data from {path}")
              encoded_parts.append(match.group(1))

          if len(encoded_parts) != 5:
              raise SystemExit(
                  f"Expected 5 embedded CV chunks, found {len(encoded_parts)}."
              )

          normalized_parts = [
              part + ("=" * (-len(part) % 4))
              for part in encoded_parts
          ]

          try:
              pdf = base64.b64decode("".join(normalized_parts), validate=True)
          except binascii.Error:
              try:
                  pdf = b"".join(
                      base64.b64decode(part, validate=True)
                      for part in normalized_parts
                  )
              except binascii.Error as error:
                  raise SystemExit(f"Could not decode embedded CV data: {error}") from error

          expected_sha256 = "222d8c593cb91bff348a435572355e1fe707bdb4463adeede4a3b49ab2d64450"
          actual_sha256 = hashlib.sha256(pdf).hexdigest()
          if not pdf.startswith(b"%PDF-"):
              raise SystemExit("The reconstructed CV data is not a PDF.")
          if actual_sha256 != expected_sha256:
              raise SystemExit(
                  f"CV checksum mismatch: expected {expected_sha256}, received {actual_sha256}"
              )

          site = Path("_site")
          if site.exists():
              shutil.rmtree(site)
          site.mkdir()

          excluded = {".git", ".github", "_site"}
          for source in Path(".").iterdir():
              if source.name in excluded:
                  continue
              destination = site / source.name
              if source.is_dir():
                  shutil.copytree(source, destination)
              else:
                  shutil.copy2(source, destination)

          (site / "Ahmed_Kandil_CV.pdf").write_bytes(pdf)
          (site / ".nojekyll").write_text("", encoding="utf-8")
          print(
              f"Built portfolio with verified CV: {len(pdf)} bytes, SHA-256 {actual_sha256}"
          )
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
