<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Page Not Found | Ahmed Kandil</title>
  <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
  <style>
    :root{--bg:#030816;--text:#f6fbff;--muted:#aebbd0;--blue:#1177ff}
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;color:var(--text);font-family:Inter,"Segoe UI",Arial,sans-serif;line-height:1.65;background:radial-gradient(circle at 8% 6%,rgba(17,119,255,.15) 0%,transparent 50%),linear-gradient(135deg,#030816 0%,#071527 100%);min-height:100vh;padding:2rem}
    main{max-width:780px;margin:0 auto}
    h1{font-size:clamp(2.4rem,6vw,4.8rem);letter-spacing:-.07em;margin:.2rem 0 1rem;line-height:1.08}
    p{margin:0 0 1rem;color:var(--muted)}
    .button-row{display:flex;gap:1rem;flex-wrap:wrap;margin-top:2rem}
    a.button{display:inline-block;padding:.75rem 1.5rem;border:1px solid var(--blue);border-radius:6px;text-decoration:none;font-weight:500;transition:all .2s;background:transparent;color:var(--text)}
    a.button:hover{background:var(--blue);color:#000}
    a.button.primary{background:var(--blue);color:#000}
    .section-label{font-size:.875rem;text-transform:uppercase;letter-spacing:.1em;color:var(--blue);margin-bottom:.5rem}
  </style>
</head>
<body>
  <main>
    <section>
      <p class="section-label">404</p>
      <h1>Page not found.</h1>
      <p>The page may have moved, or the link may no longer be available.</p>
      <div class="button-row">
        <a class="button primary" href="/">Return to Portfolio</a>
        <a class="button" href="/#projects">View Projects</a>
      </div>
    </section>
  </main>
</body>
</html>
